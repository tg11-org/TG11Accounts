# TG11 Accounts - OpenID Connect identity provider (accounts.tg11.org)
# Backend: uvicorn on 127.1.0.5:8000 (systemd tg11-accounts.service). TLS: *.tg11.org Cloudflare origin cert.
<VirtualHost *:80>
    ServerName accounts.tg11.org
    RewriteEngine On
    RewriteRule ^ https://accounts.tg11.org%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/accounts_http_error.log
    CustomLog ${APACHE_LOG_DIR}/accounts_http_access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName accounts.tg11.org
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/tg11.org.pem
    SSLCertificateKeyFile /etc/apache2/ssl/tg11.org.key
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://127.1.0.5:8000/ connectiontimeout=10 timeout=60
    ProxyPassReverse / http://127.1.0.5:8000/
    ErrorLog ${APACHE_LOG_DIR}/accounts_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/accounts_ssl_access.log combined
</VirtualHost>
</IfModule>
